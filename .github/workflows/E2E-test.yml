name: End-to-end Tests with playwright

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]

jobs:
  Jest:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: |
          cd playwright
          yarn
          yarn test
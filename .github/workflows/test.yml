name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]

jobs:
  Jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Install dependancies
        run: |
          cd api
          yarn
      - name: Run Tests
        run: |
          cd api
          yarn test
